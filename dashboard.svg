<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
  <defs>
    <filter id="g1"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#D4A5FF"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#FF69B4"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9B59B6"/><stop offset="100%" stop-color="#FF69B4"/></linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.08"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <clipPath id="bar-clip"><rect x="0" y="0" width="600" height="260"/></clipPath>
  </defs>
  <style>
    @keyframes fill1{from{width:0}to{width:160}}
    @keyframes fill2{from{width:0}to{width:120}}
    @keyframes fill3{from{width:0}to{width:140}}
    @keyframes fill4{from{width:0}to{width:100}}
    @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
    @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(600%)}}
  </style>
  <rect width="600" height="260" fill="#0a0a1a"/>
  <circle cx="150" cy="130" r="100" fill="url(#orb1)"/>
  <circle cx="450" cy="130" r="80" fill="url(#orb1)"/>
  <g opacity="0.03" stroke="#FF69B4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="260"/><line x1="60" y1="0" x2="60" y2="260"/><line x1="120" y1="0" x2="120" y2="260"/><line x1="180" y1="0" x2="180" y2="260"/><line x1="240" y1="0" x2="240" y2="260"/><line x1="300" y1="0" x2="300" y2="260"/><line x1="360" y1="0" x2="360" y2="260"/><line x1="420" y1="0" x2="420" y2="260"/><line x1="480" y1="0" x2="480" y2="260"/><line x1="540" y1="0" x2="540" y2="260"/><line x1="0" y1="0" x2="600" y2="0"/><line x1="0" y1="40" x2="600" y2="40"/><line x1="0" y1="80" x2="600" y2="80"/><line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="160" x2="600" y2="160"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="240" x2="600" y2="240"/>
  </g>
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FF69B4" opacity="0.5" letter-spacing="8">
    ACTIVITY DASHBOARD
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
  </text>
  <!-- Commits card -->
  <g>
    <rect x="30" y="50" width="165" height="70" rx="8" fill="white" opacity="0.03" stroke="#FF69B4" stroke-width="0.5" stroke-opacity="0.15"/>
    <text x="45" y="72" font-family="'Courier New', monospace" font-size="10" fill="#FF69B4" opacity="0.5" letter-spacing="3">COMMITS</text>
    <text x="45" y="100" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#FF69B4" filter="url(#g1)">
      847
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </text>
    <rect x="45" y="108" width="0" height="3" rx="1.5" fill="url(#bar1)">
      <animate attributeName="width" from="0" to="130" dur="1.5s" fill="freeze" begin="0.3s"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="45" y="108" width="130" height="3" rx="1.5" fill="url(#bar1)" opacity="0.1"/>
  </g>
  <!-- Repos card -->
  <g>
    <rect x="218" y="50" width="165" height="70" rx="8" fill="white" opacity="0.03" stroke="#D4A5FF" stroke-width="0.5" stroke-opacity="0.15"/>
    <text x="233" y="72" font-family="'Courier New', monospace" font-size="10" fill="#D4A5FF" opacity="0.5" letter-spacing="3">REPOS</text>
    <text x="233" y="100" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#D4A5FF" filter="url(#g1)">
      21
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <rect x="233" y="108" width="0" height="3" rx="1.5" fill="url(#bar2)">
      <animate attributeName="width" from="0" to="90" dur="1.5s" fill="freeze" begin="0.5s"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="233" y="108" width="90" height="3" rx="1.5" fill="url(#bar2)" opacity="0.1"/>
  </g>
  <!-- Followers card -->
  <g>
    <rect x="405" y="50" width="165" height="70" rx="8" fill="white" opacity="0.03" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.15"/>
    <text x="420" y="72" font-family="'Courier New', monospace" font-size="10" fill="#00D4FF" opacity="0.5" letter-spacing="3">FOLLOWERS</text>
    <text x="420" y="100" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#00D4FF" filter="url(#g1)">
      1
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
    </text>
    <rect x="420" y="108" width="0" height="3" rx="1.5" fill="url(#bar3)">
      <animate attributeName="width" from="0" to="20" dur="1.5s" fill="freeze" begin="0.7s"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="108" width="20" height="3" rx="1.5" fill="url(#bar3)" opacity="0.1"/>
  </g>
  <!-- Separator -->
  <line x1="50" y1="140" x2="550" y2="140" stroke="#FF69B4" stroke-width="0.5" opacity="0.1"/>
  <!-- Language bars -->
  <g font-family="'Courier New', monospace" font-size="10">
    <text x="50" y="165" fill="#FF69B4" opacity="0.6">TypeScript</text>
    <rect x="140" y="155" width="0" height="8" rx="4" fill="url(#bar1)" opacity="0.8">
      <animate attributeName="width" from="0" to="300" dur="1.2s" fill="freeze" begin="0.8s"/>
    </rect>
    <text x="450" y="165" fill="#FF69B4" opacity="0.4">
      62%
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="190" fill="#D4A5FF" opacity="0.6">JavaScript</text>
    <rect x="140" y="180" width="0" height="8" rx="4" fill="url(#bar2)" opacity="0.8">
      <animate attributeName="width" from="0" to="150" dur="1.2s" fill="freeze" begin="1s"/>
    </rect>
    <text x="300" y="190" fill="#D4A5FF" opacity="0.4">
      24%
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="215" fill="#00D4FF" opacity="0.6">Python</text>
    <rect x="140" y="205" width="0" height="8" rx="4" fill="url(#bar3)" opacity="0.8">
      <animate attributeName="width" from="0" to="60" dur="1.2s" fill="freeze" begin="1.2s"/>
    </rect>
    <text x="210" y="215" fill="#00D4FF" opacity="0.4">
      8%
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="240" fill="#9B59B6" opacity="0.6">Other</text>
    <rect x="140" y="230" width="0" height="8" rx="4" fill="#9B59B6" opacity="0.6">
      <animate attributeName="width" from="0" to="25" dur="1.2s" fill="freeze" begin="1.4s"/>
    </rect>
    <text x="175" y="240" fill="#9B59B6" opacity="0.4">
      6%
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- Radial gauges -->
  <g transform="translate(520, 180)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.1" stroke-dasharray="188.5" stroke-dashoffset="0"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.7" stroke-dasharray="188.5" stroke-dashoffset="188.5" stroke-linecap="round" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="188.5" to="75" dur="1.5s" fill="freeze" begin="0.5s"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FF69B4">
      60%
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="48" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF69B4" opacity="0.4">STREAK</text>
  </g>
  <!-- Sweep line -->
  <rect x="-50" y="0" width="50" height="260" fill="url(#bar1)" opacity="0.03">
    <animateTransform attributeName="transform" type="translate" from="-50,0" to="650,0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Floating particles -->
  <circle cx="100" cy="40" r="1.5" fill="#FF69B4" style="animation:pulse 3s ease-in-out infinite"/>
  <circle cx="500" cy="35" r="1" fill="#D4A5FF" style="animation:pulse 4s ease-in-out .5s infinite"/>
  <circle cx="300" cy="250" r="1.2" fill="#00D4FF" style="animation:pulse 3.5s ease-in-out 1s infinite"/>
</svg>
