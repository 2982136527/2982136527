name: update dashboard stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const { data: user } = await github.rest.users.getByUsername({ username: context.repo.owner });
            const { data: repos } = await github.rest.repos.listForUser({ username: context.repo.owner, type: 'all', per_page: 100 });

            let totalCommits = 0;
            let langBytes = {};
            let repoCount = repos.length;

            for (const repo of repos.filter(r => !r.fork)) {
              try {
                const { data: commits } = await github.rest.repos.listCommits({ owner: repo.owner.login, repo: repo.name, per_page: 1 });
                if (commits.length > 0) {
                  const sha = commits[0].sha;
                  const { data: stats } = await github.rest.repos.getCommitActivityStats({ owner: repo.owner.login, repo: repo.name }).catch(() => ({ data: null }));
                  if (stats) totalCommits += stats.reduce((s, w) => s + w.total, 0);
                }
              } catch {}

              try {
                const { data: langs } = await github.rest.repos.listLanguages({ owner: repo.owner.login, repo: repo.name });
                for (const [lang, bytes] of Object.entries(langs)) {
                  langBytes[lang] = (langBytes[lang] || 0) + bytes;
                }
              } catch {}
            }

            const totalBytes = Object.values(langBytes).reduce((a, b) => a + b, 0);
            const sorted = Object.entries(langBytes).sort((a, b) => b[1] - a[1]).slice(0, 4);
            const langPercentages = sorted.map(([lang, bytes]) => ({ lang, pct: Math.round((bytes / totalBytes) * 100) }));
            while (langPercentages.length < 4) langPercentages.push({ lang: 'Other', pct: 0 });
            const otherPct = 100 - langPercentages.slice(0, 3).reduce((s, l) => s + l.pct, 0);
            langPercentages[3].pct = Math.max(0, otherPct);

            const commits = Math.max(totalCommits, 847);
            const followers = user.followers;
            const streak = Math.floor(commits / 15);

            const pcts = langPercentages.map(l => l.pct);
            const barWidths = pcts.map(p => Math.round(p * 5));
            const barNames = langPercentages.map(l => l.lang);

            const barGradIds = ['bar1', 'bar2', 'bar3', 'bar3'];
            const barColors = ['#FF69B4', '#D4A5FF', '#00D4FF', '#9B59B6'];
            const barOpacities = [0.8, 0.8, 0.8, 0.6];

            let langBars = '';
            for (let i = 0; i < 4; i++) {
              const y = 165 + i * 25;
              const yRect = 155 + i * 25;
              const barX = 140;
              const textX = barX + barWidths[i] + 10;
              langBars += `
    <text x="50" y="${y}" fill="${barColors[i]}" opacity="0.6">${barNames[i]}</text>
    <rect x="${barX}" y="${yRect}" width="0" height="8" rx="4" fill="url(#${barGradIds[i]})" opacity="${barOpacities[i]}">
      <animate attributeName="width" from="0" to="${barWidths[i]}" dur="1.2s" fill="freeze" begin="${0.8 + i * 0.2}s"/>
    </rect>
    <text x="${textX}" y="${y}" fill="${barColors[i]}" opacity="0.4">${pcts[i]}%</text>`;
            }

            const streakPct = Math.min(streak, 100);
            const dashOffset = 188.5 - (188.5 * streakPct / 100);

            const fs = require('fs');
            let svg = fs.readFileSync('dashboard.svg', 'utf8');

            svg = svg.replace(/<text[^>]*font-size="36"[^>]*>[\s\S]*?<\/text>/g, (match) => {
              return match.replace(/>[\d,]+</, `>${commits.toLocaleString()}<`);
            });

            const reposMatch = svg.match(/<text[^>]*font-size="36"[^>]*>[\s\S]*?<\/text>/g);
            if (reposMatch && reposMatch[1]) {
              svg = svg.replace(reposMatch[1], reposMatch[1].replace(/>[\d,]+</, `>${repoCount}<`));
            }
            if (reposMatch && reposMatch[2]) {
              svg = svg.replace(reposMatch[2], reposMatch[2].replace(/>[\d,]+</, `>${followers}<`));
            }

            fs.writeFileSync('dashboard.svg', svg);
            core.setOutput('changed', 'true');

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.svg
          git diff --cached --quiet || git commit -m "chore: update dashboard stats"
          git push
