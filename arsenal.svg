<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-s"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-t"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.06"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#9B59B6"/></linearGradient>
  </defs>
  <g transform="scale(1.2)">
  <style>
    @keyframes o1{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes o2{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
    @keyframes p1{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
    @keyframes p2{0%,100%{opacity:.4}50%{opacity:.9}}
    @keyframes tr{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  </style>
  <rect width="600" height="260" fill="#0a0a1a"/>
  <rect width="600" height="260" fill="url(#bg-glow)"/>
  <g opacity="0.03" stroke="#FF69B4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="260"/><line x1="60" y1="0" x2="60" y2="260"/><line x1="120" y1="0" x2="120" y2="260"/><line x1="180" y1="0" x2="180" y2="260"/><line x1="240" y1="0" x2="240" y2="260"/><line x1="300" y1="0" x2="300" y2="260"/><line x1="360" y1="0" x2="360" y2="260"/><line x1="420" y1="0" x2="420" y2="260"/><line x1="480" y1="0" x2="480" y2="260"/><line x1="540" y1="0" x2="540" y2="260"/><line x1="0" y1="0" x2="600" y2="0"/><line x1="0" y1="40" x2="600" y2="40"/><line x1="0" y1="80" x2="600" y2="80"/><line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="160" x2="600" y2="160"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="240" x2="600" y2="240"/>
  </g>
  <circle cx="300" cy="120" r="110" fill="none" stroke="url(#ring-grad)" stroke-width="0.6" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="0 300 120" to="360 300 120" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="120" r="75" fill="none" stroke="#D4A5FF" stroke-width="0.4" opacity="0.1" stroke-dasharray="3 8">
    <animateTransform attributeName="transform" type="rotate" from="360 300 120" to="0 300 120" dur="40s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FF69B4" stroke-width="0.4" opacity="0.08">
    <line x1="300" y1="120" x2="300" y2="10"/><line x1="300" y1="120" x2="377" y2="15"/><line x1="300" y1="120" x2="437" y2="50"/><line x1="300" y1="120" x2="465" y2="108"/><line x1="300" y1="120" x2="450" y2="167"/><line x1="300" y1="120" x2="397" y2="205"/><line x1="300" y1="120" x2="300" y2="220"/><line x1="300" y1="120" x2="203" y2="205"/><line x1="300" y1="120" x2="150" y2="167"/><line x1="300" y1="120" x2="135" y2="108"/><line x1="300" y1="120" x2="163" y2="50"/><line x1="300" y1="120" x2="223" y2="15"/>
  </g>
  <g style="animation:o1 25s linear infinite;transform-origin:300px 120px">
    <circle cx="300" cy="10" r="2" fill="#FF69B4" style="animation:p1 3s ease-in-out infinite" filter="url(#glow-s)"/>
    <circle cx="465" cy="108" r="1.5" fill="#00D4FF" style="animation:p1 4s ease-in-out .5s infinite" filter="url(#glow-s)"/>
    <circle cx="300" cy="220" r="2" fill="#D4A5FF" style="animation:p1 3.5s ease-in-out 1s infinite" filter="url(#glow-s)"/>
    <circle cx="135" cy="108" r="1.5" fill="#FF69B4" style="animation:p1 4.5s ease-in-out 1.5s infinite" filter="url(#glow-s)"/>
  </g>
  <g style="animation:o2 30s linear infinite;transform-origin:300px 120px">
    <circle cx="377" cy="15" r="1.2" fill="#D4A5FF" style="animation:p1 3.8s ease-in-out .3s infinite"/>
    <circle cx="450" cy="167" r="1" fill="#FF69B4" style="animation:p1 4.2s ease-in-out .8s infinite"/>
    <circle cx="203" cy="205" r="1.2" fill="#00D4FF" style="animation:p1 3.3s ease-in-out 1.3s infinite"/>
    <circle cx="163" cy="50" r="1" fill="#D4A5FF" style="animation:p1 4.8s ease-in-out .6s infinite"/>
  </g>
  <!-- TypeScript -->
  <g filter="url(#glow-s)">
    <rect x="288" y="4" width="24" height="24" rx="3" fill="#3178C6" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="300" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">TS</text>
  </g>
  <!-- JavaScript -->
  <g filter="url(#glow-s)">
    <rect x="365" y="9" width="24" height="24" rx="3" fill="#F7DF1E" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="377" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#000" font-family="sans-serif">JS</text>
  </g>
  <!-- React -->
  <g filter="url(#glow-s)">
    <circle cx="437" cy="50" r="13" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="437" cy="50" r="3" fill="#61DAFB" opacity="0.8"/>
    <ellipse cx="437" cy="50" rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(30 437 50)"/>
    <ellipse cx="437" cy="50" rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(-30 437 50)"/>
  </g>
  <!-- Next.js -->
  <g filter="url(#glow-s)">
    <rect x="453" y="96" width="24" height="24" rx="12" fill="#fff" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.15;0.1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="465" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" font-family="sans-serif">N</text>
  </g>
  <!-- Node.js -->
  <g filter="url(#glow-s)">
    <polygon points="450,155 462,167 456,180 444,180 438,167" fill="#339933" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.8s" repeatCount="indefinite"/>
    </polygon>
    <text x="450" y="172" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="sans-serif">JS</text>
  </g>
  <!-- Python -->
  <g filter="url(#glow-s)">
    <rect x="385" y="193" width="24" height="24" rx="4" fill="#3776AB" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <text x="397" y="209" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD43B" font-family="sans-serif">Py</text>
  </g>
  <!-- Tailwind -->
  <g filter="url(#glow-s)">
    <polygon points="300,208 313,220 306,234 294,234 287,220" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.6s" repeatCount="indefinite"/>
    </polygon>
    <text x="300" y="224" text-anchor="middle" font-size="7" fill="#06B6D4" font-family="sans-serif">TW</text>
  </g>
  <!-- SQLite -->
  <g filter="url(#glow-s)">
    <rect x="191" y="193" width="24" height="24" rx="4" fill="#003B57" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="209" text-anchor="middle" font-size="8" font-weight="bold" fill="#4FC3F7" font-family="sans-serif">SQL</text>
  </g>
  <!-- Docker -->
  <g filter="url(#glow-s)">
    <rect x="126" y="96" width="24" height="24" rx="3" fill="#2496ED" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="101" width="4" height="4" fill="white" opacity="0.8"/><rect x="136" y="101" width="4" height="4" fill="white" opacity="0.8"/><rect x="142" y="101" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="130" y="107" width="4" height="4" fill="white" opacity="0.8"/><rect x="136" y="107" width="4" height="4" fill="white" opacity="0.8"/><rect x="142" y="107" width="4" height="4" fill="white" opacity="0.6"/>
    <rect x="133" y="113" width="4" height="4" fill="white" opacity="0.8"/><rect x="139" y="113" width="4" height="4" fill="white" opacity="0.8"/>
  </g>
  <!-- Git -->
  <g filter="url(#glow-s)">
    <polygon points="150,38 163,50 156,64 144,64 137,50" fill="#F05032" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.9s" repeatCount="indefinite"/>
    </polygon>
    <text x="150" y="54" text-anchor="middle" font-size="7" fill="white" font-family="sans-serif">G</text>
  </g>
  <!-- Linux -->
  <g filter="url(#glow-s)">
    <circle cx="223" cy="15" r="12" fill="none" stroke="#FCC624" stroke-width="1.5" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="223" y="19" text-anchor="middle" font-size="8" fill="#FCC624" font-family="sans-serif">Lx</text>
  </g>
  <!-- HTML5 -->
  <g filter="url(#glow-s)">
    <polygon points="300,0 310,0 308,18 300,22 292,18 290,0" fill="#E34F26" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.1s" repeatCount="indefinite"/>
    </polygon>
    <text x="300" y="15" text-anchor="middle" font-size="7" fill="white" font-family="sans-serif">5</text>
  </g>
  <!-- Center -->
  <g filter="url(#glow-t)">
    <circle cx="300" cy="120" r="8" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="120" r="3" fill="#FF69B4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Labels -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#FF69B4" opacity="0.4">
    <text x="300" y="256" text-anchor="middle" letter-spacing="6">
      TECH ARSENAL
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  </g>
</svg>
