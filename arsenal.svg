<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-s"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-core"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.08"/><stop offset="60%" stop-color="#9B59B6" stop-opacity="0.03"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.6"/><stop offset="40%" stop-color="#D4A5FF" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#9B59B6"/></linearGradient>
  </defs>
  <g transform="scale(1.2)">
  <rect width="600" height="300" fill="#0a0a1a"/>
  <rect width="600" height="300" fill="url(#bg-glow)"/>
  <g opacity="0.03" stroke="#FF69B4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="300"/><line x1="60" y1="0" x2="60" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/><line x1="180" y1="0" x2="180" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/><line x1="360" y1="0" x2="360" y2="300"/><line x1="420" y1="0" x2="420" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/><line x1="540" y1="0" x2="540" y2="300"/>
    <line x1="0" y1="0" x2="600" y2="0"/><line x1="0" y1="60" x2="600" y2="60"/><line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="180" x2="600" y2="180"/><line x1="0" y1="240" x2="600" y2="240"/>
  </g>

  <!-- Orbital rings -->
  <circle cx="300" cy="140" r="120" fill="none" stroke="#FF69B4" stroke-width="0.5" opacity="0.1"/>
  <circle cx="300" cy="140" r="75" fill="none" stroke="#D4A5FF" stroke-width="0.4" opacity="0.08" stroke-dasharray="4 8"/>

  <!-- Core glow -->
  <circle cx="300" cy="140" r="40" fill="url(#core-glow)" opacity="0.5"/>

  <!-- ═══ OUTER RING: 8 icons, r=120, 65s orbit ═══ -->
  <!-- TypeScript @ 0deg => (420,140) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(420,140)" filter="url(#glow-s)">
      <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#3178C6" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="sans-serif">TS</text>
    </g>
  </g>
  <!-- JavaScript @ 45deg => (385,225) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(385,225)" filter="url(#glow-s)">
      <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#F7DF1E" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.5s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#000" font-family="sans-serif">JS</text>
    </g>
  </g>
  <!-- React @ 90deg => (300,260) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(300,260)" filter="url(#glow-s)">
      <circle r="14" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="3.5" fill="#61DAFB" opacity="0.8"/>
      <ellipse rx="14" ry="5.5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(30)"/>
      <ellipse rx="14" ry="5.5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(-30)"/>
    </g>
  </g>
  <!-- Next.js @ 135deg => (215,225) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(215,225)" filter="url(#glow-s)">
      <rect x="-13" y="-13" width="26" height="26" rx="13" fill="#fff" opacity="0.1"><animate attributeName="opacity" values="0.1;0.15;0.1" dur="3.2s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" font-family="sans-serif">N</text>
    </g>
  </g>
  <!-- Python @ 180deg => (180,140) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(180,140)" filter="url(#glow-s)">
      <rect x="-13" y="-13" width="26" height="26" rx="4" fill="#3776AB" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4.2s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFD43B" font-family="sans-serif">Py</text>
    </g>
  </g>
  <!-- Tailwind @ 225deg => (215,55) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(215,55)" filter="url(#glow-s)">
      <polygon points="0,-13 12,7 -12,7" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.6s" repeatCount="indefinite"/></polygon>
      <text x="0" y="3" text-anchor="middle" font-size="8" fill="#06B6D4" font-family="sans-serif">TW</text>
    </g>
  </g>
  <!-- Docker @ 270deg => (300,20) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(300,20)" filter="url(#glow-s)">
      <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#2496ED" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="-9" y="-8" width="4" height="4" fill="white" opacity="0.8"/><rect x="-3" y="-8" width="4" height="4" fill="white" opacity="0.8"/><rect x="3" y="-8" width="4" height="4" fill="white" opacity="0.8"/>
      <rect x="-9" y="-2" width="4" height="4" fill="white" opacity="0.8"/><rect x="-3" y="-2" width="4" height="4" fill="white" opacity="0.8"/><rect x="3" y="-2" width="4" height="4" fill="white" opacity="0.6"/>
      <rect x="-6" y="4" width="4" height="4" fill="white" opacity="0.8"/><rect x="0" y="4" width="4" height="4" fill="white" opacity="0.8"/>
    </g>
  </g>
  <!-- Git @ 315deg => (385,55) -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="65s" repeatCount="indefinite"/>
    <g transform="translate(385,55)" filter="url(#glow-s)">
      <polygon points="0,-13 12,7 -12,7" fill="#F05032" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.9s" repeatCount="indefinite"/></polygon>
      <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="sans-serif">G</text>
    </g>
  </g>

  <!-- ═══ INNER RING: 4 icons, r=75, 40s reverse orbit ═══ -->
  <!-- Linux @ 0deg => (375,140) -->
  <g><animateTransform attributeName="transform" type="rotate" from="360 300 140" to="0 300 140" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(375,140)" filter="url(#glow-s)">
      <circle r="13" fill="none" stroke="#FCC624" stroke-width="1.5" opacity="0.8"><animate attributeName="opacity" values="0.8;1;0.8" dur="4.8s" repeatCount="indefinite"/></circle>
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#FCC624" font-family="sans-serif">Lx</text>
    </g>
  </g>
  <!-- SQLite @ 90deg => (300,215) -->
  <g><animateTransform attributeName="transform" type="rotate" from="360 300 140" to="0 300 140" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(300,215)" filter="url(#glow-s)">
      <rect x="-13" y="-13" width="26" height="26" rx="4" fill="#003B57" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4.5s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#4FC3F7" font-family="sans-serif">SQL</text>
    </g>
  </g>
  <!-- Node.js @ 180deg => (225,140) -->
  <g><animateTransform attributeName="transform" type="rotate" from="360 300 140" to="0 300 140" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(225,140)" filter="url(#glow-s)">
      <polygon points="0,-13 11,0 7,13 -7,13 -11,0" fill="#339933" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.8s" repeatCount="indefinite"/></polygon>
      <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="sans-serif">JS</text>
    </g>
  </g>
  <!-- HTML5 @ 270deg => (300,65) -->
  <g><animateTransform attributeName="transform" type="rotate" from="360 300 140" to="0 300 140" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(300,65)" filter="url(#glow-s)">
      <polygon points="0,-13 9,-9 7,11 0,15 -7,11 -9,-9" fill="#E34F26" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.1s" repeatCount="indefinite"/></polygon>
      <text x="0" y="4" text-anchor="middle" font-size="8" fill="white" font-family="sans-serif">5</text>
    </g>
  </g>

  <!-- ═══ SPARKLE PARTICLES ═══ -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="20s" repeatCount="indefinite"/>
    <circle cx="300" cy="20" r="2.5" fill="#FF69B4" filter="url(#glow-s)" opacity="0.7"><animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/><animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="25s" repeatCount="indefinite"/>
    <circle cx="440" cy="140" r="2" fill="#00D4FF" filter="url(#glow-s)" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="30s" repeatCount="indefinite"/>
    <circle cx="300" cy="260" r="2" fill="#D4A5FF" filter="url(#glow-s)" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateTransform attributeName="transform" type="rotate" from="360 300 140" to="0 300 140" dur="18s" repeatCount="indefinite"/>
    <circle cx="170" cy="80" r="1.5" fill="#FF69B4" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateTransform attributeName="transform" type="rotate" from="0 300 140" to="360 300 140" dur="35s" repeatCount="indefinite"/>
    <circle cx="420" cy="60" r="1.5" fill="#00D4FF" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateTransform attributeName="transform" type="rotate" from="360 300 140" to="0 300 140" dur="22s" repeatCount="indefinite"/>
    <circle cx="190" cy="210" r="1.8" fill="#D4A5FF" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Center core -->
  <g filter="url(#glow-core)">
    <circle cx="300" cy="140" r="8" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="8;11;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="140" r="3" fill="#FF69B4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Label -->
  <text x="300" y="296" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#FF69B4" opacity="0.4" letter-spacing="6">TECH ARSENAL<animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/></text>
  </g>
</svg>
