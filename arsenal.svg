<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-s"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-core"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sun-glow"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.08"/><stop offset="60%" stop-color="#9B59B6" stop-opacity="0.03"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF8E1"/><stop offset="30%" stop-color="#FFD54F"/><stop offset="60%" stop-color="#FF9800"/><stop offset="100%" stop-color="#FF69B4" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun-corona" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFD54F" stop-opacity="0.4"/><stop offset="50%" stop-color="#FF9800" stop-opacity="0.1"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#9B59B6"/></linearGradient>
  </defs>

  <rect width="960" height="420" fill="#0a0a1a"/>
  <rect width="960" height="420" fill="url(#bg-glow)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#FF69B4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="420"/><line x1="80" y1="0" x2="80" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/><line x1="400" y1="0" x2="400" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="560" y1="0" x2="560" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="880" y1="0" x2="880" y2="420"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/>
  </g>

  <!-- Elliptical orbital rings (tilted perspective) -->
  <!-- Outer orbit: rx=380, ry=80 -->
  <ellipse cx="480" cy="200" rx="380" ry="80" fill="none" stroke="#FF69B4" stroke-width="0.5" opacity="0.12"/>
  <!-- Inner orbit: rx=240, ry=50 -->
  <ellipse cx="480" cy="200" rx="240" ry="50" fill="none" stroke="#D4A5FF" stroke-width="0.4" opacity="0.08" stroke-dasharray="4 8"/>

  <!-- Sun core with soft glow -->
  <circle cx="480" cy="200" r="50" fill="url(#sun-corona)" filter="url(#sun-glow)" opacity="0.6">
    <animate attributeName="r" values="45;55;45" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#glow-core)">
    <circle cx="480" cy="200" r="18" fill="url(#sun-grad)" opacity="0.95">
      <animate attributeName="r" values="16;20;16" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="474" cy="195" r="4" fill="#FFF8E1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="488" cy="205" r="3" fill="#FFF8E1" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pulsating corona ripples (expanding light waves) -->
  <circle cx="480" cy="200" r="20" fill="none" stroke="#FFD54F" stroke-width="2.5" opacity="0">
    <animate attributeName="r" values="20;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.5;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="200" r="20" fill="none" stroke="#FFD54F" stroke-width="2.5" opacity="0">
    <animate attributeName="r" values="20;80" dur="3s" begin="-1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" begin="-1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.5;0.5" dur="3s" begin="-1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="200" r="20" fill="none" stroke="#FFD54F" stroke-width="2.5" opacity="0">
    <animate attributeName="r" values="20;80" dur="3s" begin="-2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" begin="-2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.5;0.5" dur="3s" begin="-2s" repeatCount="indefinite"/>
  </circle>

  <!-- Second layer: wider, slower, dimmer ripples -->
  <circle cx="480" cy="200" r="25" fill="none" stroke="#FF9800" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="25;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="200" r="25" fill="none" stroke="#FF9800" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="25;120" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;0.3" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Third layer: subtle pink outer glow -->
  <circle cx="480" cy="200" r="30" fill="none" stroke="#FF69B4" stroke-width="1" opacity="0">
    <animate attributeName="r" values="30;90" dur="4s" begin="-1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0" dur="4s" begin="-1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;0.2" dur="4s" begin="-1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="200" r="30" fill="none" stroke="#FF69B4" stroke-width="1" opacity="0">
    <animate attributeName="r" values="30;90" dur="4s" begin="-3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0" dur="4s" begin="-3.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;0.2" dur="4s" begin="-3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ OUTER RING: 8 icons, elliptical orbit, 65s ═══ -->
  <!-- Path: ellipse centered at (480,200), rx=380, ry=80 -->
  <!-- TypeScript -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-0s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#3178C6" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/></rect>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="sans-serif">TS</text>
  </g>
  <!-- JavaScript -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-8.125s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#F7DF1E" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.5s" repeatCount="indefinite"/></rect>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#000" font-family="sans-serif">JS</text>
  </g>
  <!-- React -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-16.25s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <circle r="14" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#61DAFB" opacity="0.8"/>
    <ellipse rx="14" ry="5.5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(30)"/>
    <ellipse rx="14" ry="5.5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(-30)"/>
  </g>
  <!-- Next.js -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-24.375s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <rect x="-13" y="-13" width="26" height="26" rx="13" fill="#fff" opacity="0.1"><animate attributeName="opacity" values="0.1;0.15;0.1" dur="3.2s" repeatCount="indefinite"/></rect>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" font-family="sans-serif">N</text>
  </g>
  <!-- Python -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-32.5s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <rect x="-13" y="-13" width="26" height="26" rx="4" fill="#3776AB" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4.2s" repeatCount="indefinite"/></rect>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFD43B" font-family="sans-serif">Py</text>
  </g>
  <!-- Tailwind -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-40.625s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <polygon points="0,-13 12,7 -12,7" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.6s" repeatCount="indefinite"/></polygon>
    <text x="0" y="3" text-anchor="middle" font-size="8" fill="#06B6D4" font-family="sans-serif">TW</text>
  </g>
  <!-- Docker -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-48.75s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#2496ED" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="-9" y="-8" width="4" height="4" fill="white" opacity="0.8"/><rect x="-3" y="-8" width="4" height="4" fill="white" opacity="0.8"/><rect x="3" y="-8" width="4" height="4" fill="white" opacity="0.8"/>
    <rect x="-9" y="-2" width="4" height="4" fill="white" opacity="0.8"/><rect x="-3" y="-2" width="4" height="4" fill="white" opacity="0.8"/><rect x="3" y="-2" width="4" height="4" fill="white" opacity="0.6"/>
    <rect x="-6" y="4" width="4" height="4" fill="white" opacity="0.8"/><rect x="0" y="4" width="4" height="4" fill="white" opacity="0.8"/>
  </g>
  <!-- Git -->
  <g filter="url(#glow-s)"><animateMotion dur="65s" repeatCount="indefinite" begin="-56.875s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <polygon points="0,-13 12,7 -12,7" fill="#F05032" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.9s" repeatCount="indefinite"/></polygon>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="sans-serif">G</text>
  </g>

  <!-- ═══ INNER RING: 4 icons, smaller elliptical orbit, 40s reverse ═══ -->
  <!-- Path: ellipse centered at (480,200), rx=240, ry=50 -->
  <!-- Linux -->
  <g filter="url(#glow-s)"><animateMotion dur="40s" repeatCount="indefinite" begin="-0s" rotate="auto" path="M720,200 A240,50 0 1,0 240,200 A240,50 0 1,0 720,200"/>
    <circle r="13" fill="none" stroke="#FCC624" stroke-width="1.5" opacity="0.8"><animate attributeName="opacity" values="0.8;1;0.8" dur="4.8s" repeatCount="indefinite"/></circle>
    <text x="0" y="4" text-anchor="middle" font-size="9" fill="#FCC624" font-family="sans-serif">Lx</text>
  </g>
  <!-- SQLite -->
  <g filter="url(#glow-s)"><animateMotion dur="40s" repeatCount="indefinite" begin="-10s" rotate="auto" path="M720,200 A240,50 0 1,0 240,200 A240,50 0 1,0 720,200"/>
    <rect x="-13" y="-13" width="26" height="26" rx="4" fill="#003B57" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4.5s" repeatCount="indefinite"/></rect>
    <text x="0" y="5" text-anchor="middle" font-size="9" font-weight="bold" fill="#4FC3F7" font-family="sans-serif">SQL</text>
  </g>
  <!-- Node.js -->
  <g filter="url(#glow-s)"><animateMotion dur="40s" repeatCount="indefinite" begin="-20s" rotate="auto" path="M720,200 A240,50 0 1,0 240,200 A240,50 0 1,0 720,200"/>
    <polygon points="0,-13 11,0 7,13 -7,13 -11,0" fill="#339933" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.8s" repeatCount="indefinite"/></polygon>
    <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="sans-serif">JS</text>
  </g>
  <!-- HTML5 -->
  <g filter="url(#glow-s)"><animateMotion dur="40s" repeatCount="indefinite" begin="-30s" rotate="auto" path="M720,200 A240,50 0 1,0 240,200 A240,50 0 1,0 720,200"/>
    <polygon points="0,-13 9,-9 7,11 0,15 -7,11 -9,-9" fill="#E34F26" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.1s" repeatCount="indefinite"/></polygon>
    <text x="0" y="4" text-anchor="middle" font-size="8" fill="white" font-family="sans-serif">5</text>
  </g>

  <!-- ═══ SPARKLE PARTICLES (elliptical paths) ═══ -->
  <g><animateMotion dur="20s" repeatCount="indefinite" rotate="auto" path="M900,200 A420,90 0 1,1 60,200 A420,90 0 1,1 900,200"/>
    <circle r="2.5" fill="#FF69B4" filter="url(#glow-s)" opacity="0.7"><animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/><animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateMotion dur="25s" repeatCount="indefinite" begin="-6s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <circle r="2" fill="#00D4FF" filter="url(#glow-s)" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateMotion dur="30s" repeatCount="indefinite" begin="-15s" rotate="auto" path="M720,200 A240,50 0 1,0 240,200 A240,50 0 1,0 720,200"/>
    <circle r="2" fill="#D4A5FF" filter="url(#glow-s)" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M900,200 A420,90 0 1,1 60,200 A420,90 0 1,1 900,200"/>
    <circle r="1.5" fill="#FF69B4" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateMotion dur="35s" repeatCount="indefinite" begin="-10s" rotate="auto" path="M860,200 A380,80 0 1,1 100,200 A380,80 0 1,1 860,200"/>
    <circle r="1.5" fill="#00D4FF" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <g><animateMotion dur="22s" repeatCount="indefinite" begin="-8s" rotate="auto" path="M720,200 A240,50 0 1,0 240,200 A240,50 0 1,0 720,200"/>
    <circle r="1.8" fill="#D4A5FF" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Label -->
  <text x="480" y="390" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#FF69B4" opacity="0.4" letter-spacing="6">TECH ARSENAL<animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/></text>
</svg>