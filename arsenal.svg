<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-s"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-t"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-core"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.08"/><stop offset="60%" stop-color="#9B59B6" stop-opacity="0.03"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF69B4" stop-opacity="0.6"/><stop offset="40%" stop-color="#D4A5FF" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#9B59B6"/></linearGradient>
  </defs>
  <g transform="scale(1.2)">
  <rect width="600" height="260" fill="#0a0a1a"/>
  <rect width="600" height="260" fill="url(#bg-glow)"/>
  <g opacity="0.03" stroke="#FF69B4" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="260"/><line x1="60" y1="0" x2="60" y2="260"/><line x1="120" y1="0" x2="120" y2="260"/><line x1="180" y1="0" x2="180" y2="260"/><line x1="240" y1="0" x2="240" y2="260"/><line x1="300" y1="0" x2="300" y2="260"/><line x1="360" y1="0" x2="360" y2="260"/><line x1="420" y1="0" x2="420" y2="260"/><line x1="480" y1="0" x2="480" y2="260"/><line x1="540" y1="0" x2="540" y2="260"/>
    <line x1="0" y1="0" x2="600" y2="0"/><line x1="0" y1="40" x2="600" y2="40"/><line x1="0" y1="80" x2="600" y2="80"/><line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="160" x2="600" y2="160"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="240" x2="600" y2="240"/>
  </g>

  <!-- Orbital rings -->
  <circle cx="300" cy="120" r="120" fill="none" stroke="#FF69B4" stroke-width="0.4" opacity="0.08"/>
  <circle cx="300" cy="120" r="75" fill="none" stroke="#D4A5FF" stroke-width="0.3" opacity="0.06" stroke-dasharray="4 8"/>
  <circle cx="300" cy="120" r="155" fill="none" stroke="#00D4FF" stroke-width="0.2" opacity="0.04" stroke-dasharray="2 10"/>

  <!-- Core glow -->
  <circle cx="300" cy="120" r="35" fill="url(#core-glow)" opacity="0.5"/>

  <!-- ═══ Outer ring icons (r=120, 8 icons, 65s orbit) ═══ -->
  <!-- TypeScript @ 0° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(420,120)" filter="url(#glow-s)">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#3178C6" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="sans-serif">TS</text>
    </g>
  </g>
  <!-- JavaScript @ 45° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(385,205)" filter="url(#glow-s)">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#F7DF1E" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.5s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#000" font-family="sans-serif">JS</text>
    </g>
  </g>
  <!-- React @ 90° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(300,240)" filter="url(#glow-s)">
      <circle r="13" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#61DAFB" opacity="0.8"/>
      <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(30)"/>
      <ellipse rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" opacity="0.5" transform="rotate(-30)"/>
    </g>
  </g>
  <!-- Next.js @ 135° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(215,205)" filter="url(#glow-s)">
      <rect x="-12" y="-12" width="24" height="24" rx="12" fill="#fff" opacity="0.1"><animate attributeName="opacity" values="0.1;0.15;0.1" dur="3.2s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" font-family="sans-serif">N</text>
    </g>
  </g>
  <!-- Python @ 180° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(180,120)" filter="url(#glow-s)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#3776AB" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4.2s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD43B" font-family="sans-serif">Py</text>
    </g>
  </g>
  <!-- Tailwind @ 225° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(215,35)" filter="url(#glow-s)">
      <polygon points="0,-12 11,6 -11,6" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.6s" repeatCount="indefinite"/></polygon>
      <text x="0" y="3" text-anchor="middle" font-size="7" fill="#06B6D4" font-family="sans-serif">TW</text>
    </g>
  </g>
  <!-- Docker @ 270° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(300,0)" filter="url(#glow-s)">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#2496ED" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="-8" y="-7" width="4" height="4" fill="white" opacity="0.8"/><rect x="-2" y="-7" width="4" height="4" fill="white" opacity="0.8"/><rect x="4" y="-7" width="4" height="4" fill="white" opacity="0.8"/>
      <rect x="-8" y="-1" width="4" height="4" fill="white" opacity="0.8"/><rect x="-2" y="-1" width="4" height="4" fill="white" opacity="0.8"/><rect x="4" y="-1" width="4" height="4" fill="white" opacity="0.6"/>
      <rect x="-5" y="5" width="4" height="4" fill="white" opacity="0.8"/><rect x="1" y="5" width="4" height="4" fill="white" opacity="0.8"/>
    </g>
  </g>
  <!-- Git @ 315° -->
  <g style="animation:o1 65s linear infinite;transform-origin:300px 120px">
    <g transform="translate(385,35)" filter="url(#glow-s)">
      <polygon points="0,-12 11,6 -11,6" fill="#F05032" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.9s" repeatCount="indefinite"/></polygon>
      <text x="0" y="3" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="sans-serif">G</text>
    </g>
  </g>

  <!-- ═══ Inner ring icons (r=75, 4 icons, 40s reverse orbit) ═══ -->
  <!-- Linux @ 0° -->
  <g style="animation:o2 40s linear infinite;transform-origin:300px 120px">
    <g transform="translate(375,120)" filter="url(#glow-s)">
      <circle r="12" fill="none" stroke="#FCC624" stroke-width="1.5" opacity="0.8"><animate attributeName="opacity" values="0.8;1;0.8" dur="4.8s" repeatCount="indefinite"/></circle>
      <text x="0" y="4" text-anchor="middle" font-size="8" fill="#FCC624" font-family="sans-serif">Lx</text>
    </g>
  </g>
  <!-- SQLite @ 90° -->
  <g style="animation:o2 40s linear infinite;transform-origin:300px 120px">
    <g transform="translate(300,195)" filter="url(#glow-s)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#003B57" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="4.5s" repeatCount="indefinite"/></rect>
      <text x="0" y="5" text-anchor="middle" font-size="8" font-weight="bold" fill="#4FC3F7" font-family="sans-serif">SQL</text>
    </g>
  </g>
  <!-- Node.js @ 180° -->
  <g style="animation:o2 40s linear infinite;transform-origin:300px 120px">
    <g transform="translate(225,120)" filter="url(#glow-s)">
      <polygon points="0,-12 10,0 6,12 -6,12 -10,0" fill="#339933" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.8s" repeatCount="indefinite"/></polygon>
      <text x="0" y="3" text-anchor="middle" font-size="7" font-weight="bold" fill="white" font-family="sans-serif">JS</text>
    </g>
  </g>
  <!-- HTML5 @ 270° -->
  <g style="animation:o2 40s linear infinite;transform-origin:300px 120px">
    <g transform="translate(300,45)" filter="url(#glow-s)">
      <polygon points="0,-12 8,-8 6,10 0,14 -6,10 -8,-8" fill="#E34F26" opacity="0.9"><animate attributeName="opacity" values="0.9;1;0.9" dur="3.1s" repeatCount="indefinite"/></polygon>
      <text x="0" y="4" text-anchor="middle" font-size="7" fill="white" font-family="sans-serif">5</text>
    </g>
  </g>

  <!-- ═══ Orbiting particles ═══ -->
  <g style="animation:o1 25s linear infinite;transform-origin:300px 120px">
    <circle cx="300" cy="-5" r="2" fill="#FF69B4" style="animation:p1 3s ease-in-out infinite" filter="url(#glow-s)"/>
    <circle cx="455" cy="108" r="1.5" fill="#00D4FF" style="animation:p1 4s ease-in-out .5s infinite" filter="url(#glow-s)"/>
    <circle cx="300" cy="245" r="2" fill="#D4A5FF" style="animation:p1 3.5s ease-in-out 1s infinite" filter="url(#glow-s)"/>
    <circle cx="145" cy="108" r="1.5" fill="#FF69B4" style="animation:p1 4.5s ease-in-out 1.5s infinite" filter="url(#glow-s)"/>
  </g>
  <g style="animation:o2 30s linear infinite;transform-origin:300px 120px">
    <circle cx="375" cy="10" r="1.2" fill="#D4A5FF" style="animation:p1 3.8s ease-in-out .3s infinite"/>
    <circle cx="440" cy="165" r="1" fill="#FF69B4" style="animation:p1 4.2s ease-in-out .8s infinite"/>
    <circle cx="210" cy="215" r="1.2" fill="#00D4FF" style="animation:p1 3.3s ease-in-out 1.3s infinite"/>
    <circle cx="168" cy="40" r="1" fill="#D4A5FF" style="animation:p1 4.8s ease-in-out .6s infinite"/>
  </g>

  <!-- Center core -->
  <g filter="url(#glow-core)">
    <circle cx="300" cy="120" r="8" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="120" r="3" fill="#FF69B4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Label -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#FF69B4" opacity="0.4">
    <text x="300" y="256" text-anchor="middle" letter-spacing="6">
      TECH ARSENAL
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  </g>
</svg>
